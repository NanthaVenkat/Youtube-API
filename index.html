<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube API Example</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h1>YouTube Video Information</h1>
        <div class="input-section">
            <label for="videoLink">Enter YouTube Video Link:</label>
            <input type="text" id="videoLink" placeholder="Paste YouTube Video Link">
            <button id="cta">Add</button>
            <button id="clear-btn">Clear</button>

        </div>
        <span id="videoInfo" class="message"></span>
        <div class="table-container">
            <table>
                <thead>
                    <th>Title</th>
                    <th>Publish Date</th>
                    <th>Views</th>
                    <th>Likes</th>
                    <th>Comments</th>
                </thead>
                <tbody id="tbody">
                </tbody>
            </table>
        </div>
        <div id="video-embed-container">
            <h2>Currently Viewed Video</h2>
            <div id="player"></div>
        </div>

    </div>

    <script src="script.js"></script>
</body>

</html>
